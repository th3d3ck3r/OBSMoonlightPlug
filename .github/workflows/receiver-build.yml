name: Receiver native builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libobs-dev libavcodec-dev libavutil-dev libswscale-dev libopus-dev libssl-dev qt6-base-dev libsimde-dev
      - run: cmake -S . -B build-check -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build-check --parallel 4
      - run: ctest --test-dir build-check --output-on-failure
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/cache/restore@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: windows-openssl-static-md-v1
      - name: Static crypto dependency
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install openssl:x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache/save@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: windows-openssl-static-md-v1
      - uses: actions/cache/restore@v4
        with:
          path: .deps
          key: windows-obs-sdk-2025-07-11-v1
      - name: Configure and build Windows x64
        shell: pwsh
        run: |
          cmake --preset windows-x64 -DOPENSSL_ROOT_DIR="$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md" -DOPENSSL_USE_STATIC_LIBS=ON -DRECEIVER_BUILD_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset windows-x64 --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install build_x64 --config RelWithDebInfo --prefix package/windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/bundle-runtimes.py package/windows/obs-gamestream-receiver/bin/64bit/obs-gamestream-receiver.dll .deps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .deps
          key: windows-obs-sdk-2025-07-11-v1
      - uses: actions/upload-artifact@v4
        with:
          name: obs-gamestream-receiver-windows-x64
          path: package/windows
          if-no-files-found: error
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: .deps
          key: macos-openssl-3.5.8-obs-2025-07-11-v1
      - name: Build universal crypto dependency
        run: bash scripts/build-crypto-macos.sh
      - name: Configure and build Mac universal
        run: |
          cmake --preset macos -DOPENSSL_ROOT_DIR="$PWD/.deps/openssl-universal" -DOPENSSL_USE_STATIC_LIBS=ON -DRECEIVER_BUILD_TESTS=OFF
          cmake --build --preset macos --parallel 4
          original=$(find build_macos -maxdepth 3 -name 'obs-gamestream-receiver.plugin' -type d | head -1)
          test -n "$original"
          mkdir -p package/macos
          ditto "$original" package/macos/obs-gamestream-receiver.plugin
          python3 scripts/bundle-runtimes.py package/macos/obs-gamestream-receiver.plugin .deps
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .deps
          key: macos-openssl-3.5.8-obs-2025-07-11-v1
      - uses: actions/upload-artifact@v4
        with:
          name: obs-gamestream-receiver-macos-universal
          path: package/macos
          if-no-files-found: error
  release:
    needs: [linux-check, windows, macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package downloads and publish preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir downloads
          for platform in windows-x64 macos-universal; do
            folder="artifacts/obs-gamestream-receiver-$platform"
            cp LICENSE "$folder/LICENSE.txt"
            cp README.md "$folder/README.md"
            cp docs/UPSTREAM.md "$folder/UPSTREAM.md"
            (cd "$folder" && zip -qr "$GITHUB_WORKSPACE/downloads/obs-gamestream-receiver-$platform.zip" .)
          done
          tag="v0.1.0-preview.${{ github.run_number }}"
          gh release create "$tag" downloads/*.zip --target "$GITHUB_SHA" --prerelease --title "GameStream Receiver 0.1.0 Preview ${{ github.run_number }}" --notes "Windows x64 and universal Intel/Apple Silicon Mac builds. Linux media tests passed. Live-host and OBS loading validation are still required. Installation instructions are included."
